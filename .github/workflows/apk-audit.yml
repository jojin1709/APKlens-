name: APKLens Security Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required to upload SARIF to GitHub Code Scanning

jobs:
  static-audit:
    name: APKLens Static Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run APKLens Headless Static Audit
        run: |
          mkdir -p reports
          # Scan sample or target built APK
          TARGET_APK="public/samples/InsecureBankv2.apk"
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            TARGET_APK=(app/build/outputs/apk/release/*.apk)
          fi
          echo "Scanning: $TARGET_APK"
          node scripts/apklens-ci.mjs "$TARGET_APK" --sarif reports/apklens-results.sarif

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/apklens-results.sarif
          category: apklens-sast
