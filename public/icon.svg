<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="100%" stop-color="#121622"/>
    </linearGradient>

    <!-- Inset Rim Bevel -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Electric Cyan Gradient for Aperture -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00a2ff"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Android Antennae (Official #3DDC84 Green) -->
  <line x1="44" y1="52" x2="31" y2="30" stroke="#3DDC84" stroke-width="6" stroke-linecap="round"/>
  <line x1="84" y1="52" x2="97" y2="30" stroke="#3DDC84" stroke-width="6" stroke-linecap="round"/>

  <!-- Android Robot Head Dome (Official #3DDC84 Green) -->
  <path d="M 25 82.5 A 39 39 0 0 1 103 82.5 Z" fill="#3DDC84"/>

  <!-- Left Classic Android Eye -->
  <circle cx="45" cy="65" r="4.2" fill="#ffffff"/>

  <!-- Right Eye: APKLens Optical Camera Aperture -->
  <!-- Outer Aperture Ring -->
  <circle cx="81.5" cy="65" r="12" fill="#090b10" stroke="#ffffff" stroke-width="2.4"/>
  <!-- Cyan Precision Aperture Ring -->
  <circle cx="81.5" cy="65" r="8.5" fill="none" stroke="url(#cyanGrad)" stroke-width="1.6"/>
  <!-- Center Pupil & Lens Glint -->
  <circle cx="81.5" cy="65" r="3.2" fill="url(#cyanGrad)"/>
  <circle cx="82.6" cy="63.9" r="1.1" fill="#ffffff"/>
</svg>
