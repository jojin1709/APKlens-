<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Canvas: Deep Obsidian / Charcoal like Bionic & Proton -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e15"/>
      <stop offset="100%" stop-color="#121622"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00a2ff"/>
    </linearGradient>

    <!-- Vivid Purple Gradient like Burp & Proton -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b066ff"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Bevel Rim Highlight -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with 1px top highlight -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Android Antennae (Bold angled vector capsules) -->
  <line x1="44" y1="36" x2="33" y2="19" stroke="url(#cyanGrad)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="84" y1="36" x2="95" y2="19" stroke="url(#cyanGrad)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Outer Lens Ring (Pure Solid White - ultra readable on small taskbars & tabs) -->
  <circle cx="64" cy="69" r="32" fill="none" stroke="#ffffff" stroke-width="7.5"/>

  <!-- Precision Aperture Iris Blades (Geometric Security Prism) -->
  <!-- Top Right Blade (Electric Cyan) -->
  <path d="M64 44 C76 44 87 53 89 65 L64 69 Z" fill="url(#cyanGrad)"/>

  <!-- Bottom Blade (Vivid Royal Purple) -->
  <path d="M89 65 C88 79 78 89 64 91 L64 69 Z" fill="url(#purpleGrad)"/>

  <!-- Left Blade (Cobalt / Indigo) -->
  <path d="M64 91 C50 89 40 78 39 65 L64 69 Z" fill="#2563eb"/>

  <!-- Top Left Blade (Teal / Emerald) -->
  <path d="M39 65 C41 53 51 44 64 44 L64 69 Z" fill="#00e5a3"/>

  <!-- Inner Focal Lens Core (Dark Void + White Optical Point) -->
  <circle cx="64" cy="69" r="13" fill="#0c0e15" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="64" cy="69" r="6" fill="url(#cyanGrad)"/>
  <circle cx="66" cy="67" r="2" fill="#ffffff"/>
</svg>
