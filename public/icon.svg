<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#glowFilter)"/>

  <!-- Subtle Inner Grid / Tech Lines -->
  <path d="M24 64H104 M64 24V104" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>

  <!-- Outer Security Shield -->
  <path d="M64 26L92 37V62C92 79 79.5 94.5 64 100C48.5 94.5 36 79 36 62V37L64 26Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Inspection Aperture / Lens Circle -->
  <circle cx="64" cy="58" r="18" stroke="url(#lensGrad)" stroke-width="3.5" fill="rgba(15, 23, 42, 0.7)"/>

  <!-- Android Robot Antennae & Head inside Lens -->
  <circle cx="59" cy="54" r="1.8" fill="#38bdf8"/>
  <circle cx="69" cy="54" r="1.8" fill="#38bdf8"/>
  <path d="M56 47L53 43 M72 47L75 43" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M54 58C54 52.477 58.477 48 64 48C69.523 48 74 52.477 74 58H54Z" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Lens Inspection Handle -->
  <path d="M78 72L93 87" stroke="url(#lensGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="93" cy="87" r="2.5" fill="#a855f7"/>
</svg>
